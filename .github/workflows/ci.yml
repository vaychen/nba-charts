name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  checks:
    name: ${{ matrix.os }} checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    env:
      NBA_CHARTS_KOBE_DATA_SOURCE: file

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version-file: .python-version
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Run Ruff
        run: uv run ruff check src tests scripts

      - name: Run mypy
        run: uv run mypy src

      - name: Run pytest
        run: uv run pytest
