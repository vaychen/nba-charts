[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "nba-charts"
version = "0.2.0"
description = "Cross-platform NBA analytics APIs, ETL jobs, and dynamic chart demos."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "dash~=2.18.2",
    "fastapi~=0.115.12",
    "matplotlib~=3.10.1",
    "nba-api~=1.10.1",
    "pandas~=2.2.3",
    "plotly~=6.0.1",
    "psycopg[binary]~=3.2.6",
    "python-dotenv~=1.0.1",
    "uvicorn~=0.34.0"
]

[project.scripts]
nba-charts-api = "nba_charts.api.main:run"
nba-charts-dashboard = "nba_charts.ui.dash_app:run"
nba-charts-kobe-shot-poc = "nba_charts.ui.kobe_shot_poc:run"
nba-charts-sync = "nba_charts.etl.sync_reference:main"

[tool.uv]
default-groups = ["dev", "lint", "test"]

[dependency-groups]
dev = [
    "ipykernel~=6.29.5",
]

lint = [
    "mypy~=1.15.0",
    "ruff~=0.11.0",
]

test = [
    "httpx~=0.28.1",
    "pytest~=8.3.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nba_charts"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
ignore_missing_imports = true
