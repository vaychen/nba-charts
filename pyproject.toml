[project]
name = "nba-charts"
version = "0.1.0"
description = "NBA analytics data pipeline and reporting."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask~=3.1.0",
    "jinja2~=3.1.4",
    "requests~=2.32.3",          # API/Web scraping
    "beautifulsoup4~=4.12.0",    # HTML parsing
    "nba-api~=1.9.0",            # Official NBA data
    "pandas~=2.2.2",             # Data processing
    "sqlalchemy~=2.0.30",        # Database ORM
    "apscheduler~=3.10.4",       # Scheduled tasks
    "python-dotenv~=1.0.1",      # Environment variables
    "pyecharts~=2.0.8",          # Python ECharts wrapper
    "flask-sqlalchemy~=3.1.1",   # Flask DB integration
    "flask-cors~=4.0.1",         # API CORS support
    "psycopg2~=2.9.10"           # PostgreSQL adapter
]

[tool.uv]
# include below dependency groups in the environment as default
default-groups = ["dev", "lint", "test"]

[dependency-groups]
dev = [
    "uvicorn~=0.29.0",           # ASGI server (dev)
]

lint = [
    "pylint~=3.1.0",
    "ruff~=0.4.4",
    "isort~=5.13.2",
    "mypy~=1.10.0",
]

test = [
    "pytest~=8.2.0",
    "pytest-cov~=5.0.0",
    "faker~=25.2.0",             # Test data generation
]
